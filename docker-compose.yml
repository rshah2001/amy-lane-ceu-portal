# Local/demo stack: Postgres + FastAPI backend + Flutter web (nginx).
# Usage: docker compose up --build
#   Portal:   http://localhost:8080
#   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceu_compliance
      POSTGRES_USER: ceu_user
      POSTGRES_PASSWORD: ceu_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceu_user -d ceu_compliance"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ceu_user:ceu_password@db:5432/ceu_compliance
      SECRET_KEY: local-docker-secret-change-in-production
      BACKEND_CORS_ORIGINS: http://localhost:8080
      STORAGE_DIR: /app/storage
      EMAIL_DELIVERY_MODE: log
    volumes:
      - retained_files:/app/storage
    depends_on:
      db:
        condition: service_healthy
    # python:3.13-slim has no curl/wget, so probe with the stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
  retained_files:

