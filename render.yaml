# Render blueprint for the CEU portal backend (FastAPI).
# Frontend is deployed separately on Vercel; database on Supabase.
# Deploy: push this repo to GitHub, then "New + > Blueprint" in Render and pick it.
services:
  - type: web
    name: ceu-portal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Generate a strong value: `python -c "import secrets;print(secrets.token_urlsafe(48))"`
      - key: SECRET_KEY
        generateValue: true
      # From Supabase: Project Settings > Database > Connection string (URI).
      # Convert the postgresql:// prefix to postgresql+psycopg:// for SQLAlchemy.
      - key: DATABASE_URL
        sync: false
      # The Vercel frontend origin(s), comma-separated. Set after the frontend deploys.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      # Render blocks outbound SMTP, so email goes through Resend's HTTPS API.
      - key: EMAIL_DELIVERY_MODE
        value: resend
      # The re_... API key from the Resend dashboard.
      - key: RESEND_API_KEY
        sync: false
      # Verified sender, e.g. "NMEDA CEU Portal <certificates@nmeda.com>".
      - key: RESEND_FROM
        sync: false
      # Shown in the do-not-reply footer of outgoing mail, e.g. amy.otley@nmeda.org
      - key: REPLY_CONTACT_EMAIL
        sync: false
      - key: RETENTION_YEARS
        value: "7"
      - key: STORAGE_DIR
        value: /app/storage
      # Supabase Storage (durable files; the Render disk is ephemeral).
      # Create a PRIVATE bucket in Supabase > Storage first. Leave these unset
      # to fall back to local-disk-only storage.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
